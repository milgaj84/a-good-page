[package]
name = "a-good-page"
version = "0.8.3"
description = "A cozy WYSIWYG Markdown editor for writers"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "a_good_page_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
