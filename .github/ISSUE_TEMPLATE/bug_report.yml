name: Bug report
description: Something went wrong while writing, saving or exporting.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. If words were lost, please say so first; that is always the top priority.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open a .md file\n2. ...\n3. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: A Good Page version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: dropdown
    id: data
    attributes:
      label: Were any words lost?
      options: ["No", "Yes", "Not sure"]
    validations:
      required: true
